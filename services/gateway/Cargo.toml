[package]
name = "authlink-gateway"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
authlink-contracts = { path = "../../crates/authlink-contracts" }
authlink-guardian = { path = "../../crates/authlink-guardian" }
authlink-policy = { path = "../../crates/authlink-policy" }
authlink-store = { path = "../../crates/authlink-store" }
axum = "0.8.9"
tokio = { version = "1", features = ["full"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
