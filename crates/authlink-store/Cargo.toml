[package]
name = "authlink-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
authlink-contracts = { path = "../authlink-contracts" }
authlink-vault = { path = "../authlink-vault" }
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "json", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
