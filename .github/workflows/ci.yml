name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm run build

  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p authlink-contracts -p authlink-device -p authlink-guardian -p authlink-idp -p authlink-policy -p authlink-store -p authlink-vault -p authlink-device-service -p authlink-gateway -p authlink-vault-service
      - run: cargo test -p authlink-contracts -p authlink-device -p authlink-guardian -p authlink-idp -p authlink-policy -p authlink-vault -p authlink-device-service -p authlink-gateway -p authlink-vault-service

  migration-syntax:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: authlink
          POSTGRES_PASSWORD: authlink_dev_only
          POSTGRES_DB: authlink
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U authlink -d authlink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: authlink_dev_only
    steps:
      - uses: actions/checkout@v4
      - run: for file in migrations/*.sql; do echo "Applying $file"; psql -h 127.0.0.1 -p 54329 -U authlink -d authlink -v ON_ERROR_STOP=1 -f "$file"; done

  store-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: authlink
          POSTGRES_PASSWORD: authlink_dev_only
          POSTGRES_DB: authlink
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U authlink -d authlink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: authlink_dev_only
      DATABASE_URL: postgres://authlink:authlink_dev_only@127.0.0.1:54329/authlink
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: for file in migrations/*.sql; do psql -h 127.0.0.1 -p 54329 -U authlink -d authlink -v ON_ERROR_STOP=1 -f "$file"; done
      - run: cargo test -p authlink-store --test postgres

  local-runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bootstrap Postgres OpenFGA Rauthy and AuthLink schema
        run: node scripts/bootstrap-local.mjs all
      - name: Verify generated configuration
        run: |
          grep -q '^OPENFGA_STORE_ID=.' .env.local
          grep -q '^OPENFGA_AUTHORIZATION_MODEL_ID=.' .env.local
          grep -q '^RAUTHY_ENC_KEYS=.' .env.local
          grep -q '^AUTHLINK_VAULT_ACTIVE_KEY_VERSION=1$' .env.local
          grep -q '^AUTHLINK_VAULT_KEYS=1/.' .env.local
      - name: Verify infrastructure endpoints
        run: |
          curl --fail --silent http://localhost:8080/healthz | grep SERVING
          curl --fail --silent http://localhost:8085/auth/v1/.well-known/openid-configuration | grep code_challenge_methods_supported
      - name: Dump local runtime logs on failure
        if: failure()
        run: docker compose --env-file .env.local -f infra/compose/docker-compose.dev.yml logs --no-color --tail=250
