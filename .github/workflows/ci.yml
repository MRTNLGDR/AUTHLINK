name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm run build

  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p authlink-contracts -p authlink-guardian -p authlink-gateway
      - run: cargo test -p authlink-contracts -p authlink-guardian -p authlink-gateway

  migration-syntax:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: authlink
          POSTGRES_PASSWORD: authlink_dev_only
          POSTGRES_DB: authlink
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U authlink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: authlink_dev_only
    steps:
      - uses: actions/checkout@v4
      - run: for file in migrations/*.sql; do echo "Applying $file"; psql -h 127.0.0.1 -p 54329 -U authlink -d authlink -v ON_ERROR_STOP=1 -f "$file"; done
